name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.3"

jobs:
  apk:
    name: APK derle
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4

      - name: Godot ayarlarını hazırla
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mkdir -v -p ~/.config/
          mv /root/.config/godot ~/.config/godot
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Debug imza anahtarını tanıt
        run: |
          sed 's@keystore/debug=".*"@keystore/debug="/root/debug.keystore"@g' -i export_presets.cfg
          sed 's@keystore/debug_user=".*"@keystore/debug_user="androiddebugkey"@g' -i export_presets.cfg
          sed 's@keystore/debug_password=".*"@keystore/debug_password="android"@g' -i export_presets.cfg

      - name: Kaynakları içe aktar
        run: godot --headless --import || true

      - name: APK oluştur
        run: |
          mkdir -p build
          godot --headless --verbose --export-debug "Android" build/efsane-yolu.apk
          ls -la build

      - name: APK'yı yükle (Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: efsane-yolu-apk
          path: build/efsane-yolu.apk

      - name: Sürüm sayfasına koy (telefondan kolay indirme)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Efsane Yolu 1.0.${{ github.run_number }}
          body: Telefonuna indirip kur. Kurulumda "bilinmeyen kaynaklara izin ver" demen gerekebilir.
          files: build/efsane-yolu.apk
